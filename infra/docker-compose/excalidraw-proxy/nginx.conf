events {
    worker_connections 1024;
}

http {
    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Proxy pour POST /api/v2/post/ → /api/v2/scenes
        location = /api/v2/post/ {
            proxy_pass http://backend:8080/api/v2/scenes;
            proxy_http_version 1.1;

            # Headers CORS
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

            # Gestion preflight OPTIONS
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Proxy pour GET /api/v2/:id → /api/v2/scenes/:id
        location ~ ^/api/v2/([^/]+)$ {
            proxy_pass http://backend:8080/api/v2/scenes/$1;
            proxy_http_version 1.1;

            # Headers CORS
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type' always;

            # Gestion preflight OPTIONS
            if ($request_method = 'OPTIONS') {
                return 204;
            }

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fallback : tout le reste va directement au backend
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;

            # Headers CORS
            add_header 'Access-Control-Allow-Origin' '*' always;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
