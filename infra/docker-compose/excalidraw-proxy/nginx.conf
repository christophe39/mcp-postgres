events {
    worker_connections 1024;
}

http {
    # Logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    server {
        listen 80;
        server_name _;

        # Taille max du body
        client_max_body_size 10M;

        # Health check endpoint
        location /health {
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Proxy pour POST /api/v2/post/ → /api/v2/scenes
        location = /api/v2/post/ {
            proxy_pass http://backend:8080/api/v2/scenes;
            proxy_http_version 1.1;

            # Transmission du body
            proxy_pass_request_body on;
            proxy_request_buffering off;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Content-Length $content_length;
            proxy_set_header Transfer-Encoding $http_transfer_encoding;
        }

        # Proxy pour GET /api/v2/:id → /api/v2/scenes/:id
        location ~ ^/api/v2/([^/]+)$ {
            proxy_pass http://backend:8080/api/v2/scenes/$1;
            proxy_http_version 1.1;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Fallback : tout le reste va directement au backend
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;

            # Proxy headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
