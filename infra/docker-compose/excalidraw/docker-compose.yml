version: '3.8'

services:
  # Frontend Excalidraw (React app)
  frontend:
    image: excalidraw/excalidraw:latest
    container_name: excalidraw-frontend
    restart: unless-stopped
    environment:
      # Configuration du backend storage
      - VITE_APP_BACKEND_V2_GET_URL=https://exca-api.agnisolution.fr/api/v2/scenes/
      - VITE_APP_BACKEND_V2_POST_URL=https://exca-api.agnisolution.fr/api/v2/scenes
      # Désactiver le tracking analytics
      - VITE_APP_DISABLE_TRACKING=true
    labels:
      # Traefik routing (généré automatiquement par Coolify)
      - "traefik.enable=true"
      - "traefik.http.routers.excalidraw-frontend.rule=Host(`excalidraw.agnisolution.fr`)"
      - "traefik.http.routers.excalidraw-frontend.entrypoints=https"
      - "traefik.http.routers.excalidraw-frontend.tls=true"
      - "traefik.http.routers.excalidraw-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.excalidraw-frontend.loadbalancer.server.port=80"
    networks:
      - coolify

  # Backend Storage (Node.js API + Postgres)
  backend:
    image: kiliandeca/excalidraw-storage-backend:latest
    container_name: excalidraw-backend
    restart: unless-stopped
    environment:
      # Configuration Postgres
      - STORAGE_BACKEND=postgres
      - POSTGRES_HOST=10.0.1.23
      - POSTGRES_PORT=5432
      - POSTGRES_DB=excalidraw_storage
      - POSTGRES_USER=excalidraw_backend
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      # Configuration serveur
      - PORT=8080
      - NODE_ENV=production
      # CORS - autoriser seulement nos domaines
      - CORS_ALLOWED_ORIGINS=https://excalidraw.agnisolution.fr,https://mcp-excalidraw.agnisolution.fr
      # Sécurité - IDs longs et aléatoires
      - ID_LENGTH=12
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.excalidraw-backend.rule=Host(`exca-api.agnisolution.fr`)"
      - "traefik.http.routers.excalidraw-backend.entrypoints=https"
      - "traefik.http.routers.excalidraw-backend.tls=true"
      - "traefik.http.routers.excalidraw-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.excalidraw-backend.loadbalancer.server.port=8080"
    networks:
      - coolify
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  coolify:
    external: true
