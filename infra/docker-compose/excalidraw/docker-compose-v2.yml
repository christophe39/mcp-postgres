version: '3.8'

services:
  # Frontend Excalidraw (React app)
  frontend:
    image: excalidraw-opepartner:latest
    container_name: excalidraw-frontend
    restart: unless-stopped
    environment:
      - VITE_APP_BACKEND_V2_GET_URL=https://exca-api.agnisolution.fr/api/v2/
      - VITE_APP_BACKEND_V2_POST_URL=https://exca-api.agnisolution.fr/api/v2/post/
      - VITE_APP_DISABLE_TRACKING=true
    labels:
      - traefik.enable=true
      - traefik.http.routers.excalidraw-frontend.rule=Host(`excalidraw.agnisolution.fr`)
      - traefik.http.routers.excalidraw-frontend.entrypoints=https
      - traefik.http.routers.excalidraw-frontend.tls=true
      - traefik.http.routers.excalidraw-frontend.tls.certresolver=letsencrypt
      - traefik.http.services.excalidraw-frontend.loadbalancer.server.port=80
    networks:
      - coolify

  # Proxy adaptateur (traduit les URLs entre frontend et backend)
  proxy:
    image: nginx:alpine
    container_name: excalidraw-proxy
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.excalidraw-proxy.rule=Host(`exca-api.agnisolution.fr`)
      - traefik.http.routers.excalidraw-proxy.entrypoints=https
      - traefik.http.routers.excalidraw-proxy.tls=true
      - traefik.http.routers.excalidraw-proxy.tls.certresolver=letsencrypt
      - traefik.http.services.excalidraw-proxy.loadbalancer.server.port=80
    networks:
      - coolify
    depends_on:
      - backend

  # Backend Storage (Node.js API + Postgres)
  backend:
    image: kiliandeca/excalidraw-storage-backend:latest
    container_name: excalidraw-backend
    restart: unless-stopped
    environment:
      # Configuration Postgres (URI complète)
      - STORAGE_URI=postgresql://excalidraw_backend:aMU2bB7AFT0BNeOVbmW5Zey8Qnk2G6tXyTe1oqpC7PA=@10.0.1.23:5432/excalidraw_storage
      # Configuration serveur
      - PORT=8080
      - NODE_ENV=production
      # CORS - autoriser seulement nos domaines
      - CORS_ALLOWED_ORIGINS=https://excalidraw.agnisolution.fr,https://mcp-excalidraw.agnisolution.fr
      # Sécurité - IDs longs et aléatoires
      - ID_LENGTH=12
    networks:
      - coolify
    # Pas de labels Traefik : backend accessible uniquement via le proxy

networks:
  coolify:
    external: true
